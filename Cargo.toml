[package]
name = "oxidems_lib"
version = "0.1.1"
edition = "2024"

[dependencies]
similarity = "0.2.0"
nohash-hasher = "0.2"
chemistry_consts = "0.2.0"
rayon = "1.11.0"
rand = "0.10.0"
rand_distr = "0.6.0"
plotters = { version = "0.3.7" }
xxhash-rust = {version="0.8.15", features = ["xxh32"]}
fast-float = "0.2.0"
memmap2 = "0.9.10"
memchr = "2.8.0"
quick-xml = "0.36"
base64 = "0.22"
bytemuck = "1.25.0"
compact_str = "0.9.0"
itertools = "0.14.0"
faer = { version = "0.24", features = ["nightly", "sparse", "rayon"], default-features = false }

wgpu = {version="29.0.1", optional = true}
pollster = {version="0.4.0", optional = true}
rkyv = "0.8.16"
libdeflater = "1.25.2"


[dev-dependencies]
criterion = "0.8.2"
pollster = "0.4.0"
wgpu = "29.0.1"
bytemuck = "1.25.0"
libc = "0.2"
flate2 = "1.1.9"
matrixmultiply = "0.3"

[features]
gpu = ["dep:wgpu", "dep:pollster"]
# plotting = ["dep:plotters"]

[profile.release]
# debug = true
strip=true
opt-level = 3
#codegen-units = 1



[[bench]]
name = "wgpu_bench"
harness = false

[[bench]]
name = "cosine_benchmark"
harness = false
