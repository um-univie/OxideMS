[package]
name = "oxidems_lib"
version = "0.1.1"
edition = "2024"
license = "MIT AND LGPL-3.0-or-later"
description = "Spectral clustering and SIRIUS-style annotation for mass spectrometry"
repository = "https://github.com/um-univie/OxideMS"
# Only source and license files are published; scratch/, data and experiment
# outputs stay out of the crate.
include = [
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/LICENSE",
    "/LICENSES/**",
    "/ATTRIBUTION.md",
    "/README.md",
]

[dependencies]
similarity = "0.2.0"
nohash-hasher = "0.2"
chemistry_consts = "0.2.0"
rayon = "1.11.0"
rand = "0.10.0"
rand_distr = "0.6.0"
plotters = { version = "0.3.7", default-features = false, features = [
    "all_elements",
    "all_series",
    "bitmap_backend",
    "bitmap_encoder",
    "bitmap_gif",
    "svg_backend",
    "chrono",
    "image",
    "deprecated_items",
    "full_palette",
    "colormaps",
    "ab_glyph",
] }
xxhash-rust = {version="0.8.15", features = ["xxh32"]}
fast-float = "0.2.0"
memmap2 = "0.9.10"
memchr = "2.8.0"
quick-xml = "0.36"
base64 = "0.22"
bytemuck = "1.25.0"
compact_str = "0.9.0"
itertools = "0.14.0"
faer = { version = "0.24", features = ["nightly", "sparse", "rayon"], default-features = false }

wgpu = {version="29.0.1", optional = true}
pollster = {version="0.4.0", optional = true}
rkyv = "0.8.16"
libdeflater = "1.25.2"
# Public oxidane at a fixed revision (not on crates.io). To develop both
# crates together, see "Developing with a local oxidane" in README.md.
oxidane = { git = "https://github.com/um-univie/oxidane", rev = "8dcee8b3921699872c5e92b3768ec8edf1598e06", default-features = false, optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
good_lp = { version = "1.15.3", default-features = false, features = ["microlp"], optional = true }
rustc-hash = "2.1.3"
clap = { version = "4.5", features = ["derive"], optional = true }


[dev-dependencies]
criterion = "0.8.2"
pollster = "0.4.0"
wgpu = "29.0.1"
bytemuck = "1.25.0"
libc = "0.2"
flate2 = "1.1.9"
matrixmultiply = "0.3"

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"] }

[features]
default = ["sirius"]
# SIRIUS-style annotation (fragmentation trees, fingerprint prediction). Pulls
# in candle, good_lp and the sibling oxidane crate; clustering-only users such
# as RedshiftMS disable it. Includes the files ported from SIRIUS, which are
# LGPL-3.0-or-later (see ATTRIBUTION.md); without this feature the build is
# MIT only.
sirius = ["dep:candle-core", "dep:candle-nn", "dep:good_lp", "dep:oxidane"]
gpu = ["dep:wgpu", "dep:pollster"]
# The `oxidems` command-line tool (src/bin/oxidems.rs).
cli = ["dep:clap"]
# plotting = ["dep:plotters"]

[profile.release]
debug = true
strip = false
opt-level = 3



[[bin]]
name = "oxidems"
path = "src/bin/oxidems.rs"
required-features = ["cli"]

